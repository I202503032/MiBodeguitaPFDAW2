<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">

  <title>Mi BodegaApp</title>
  <link th:href="@{vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{css/heroic-features.css}" rel="stylesheet">
</head>
<body>
  <div th:include="administrador/template_admin.html::header"></div>

<div class="container">
  <h1 class="mt-4 mb-3">
    Mi BodegaApp<small> Productos</small>
  </h1>
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
    <li class="breadcrumb-item active">Ver Productos</li>
  </ol>
  <a class="btn btn-primary" th:href="@{/productos/create}" > Crear Producto</a>
  <h2>Productos</h2>
  <table class="table">
    <thead>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Descripcion</th>
        <th scope="col">Inventario</th>
        <th scope="col">Precio</th>
        <th scope="col">Acción</th>
        <th scope="col">Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="producto : ${productos}">
      <td th:text="${producto.nombre}"></td>
      <td th:text="${producto.descripcion}"></td>
      <td th:text="${producto.cantidad}"></td>
      <td th:text="${producto.precio}"></td>
        
        <td><a  class="btn btn-warning" th:href="@{productos/edit/{id}(id=${producto.id})}">EDITAR</a> </td>
        <td><a  class="btn btn-danger" th:href="@{productos/delete/{id}(id=${producto.id})}">ELIMINAR</a> </td>
      </tr>       
    </tbody>
  </table>

</div>


<div th:include="administrador/template_admin.html::footer"></div>
    <script th:src="@{vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
